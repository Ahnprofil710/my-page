<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안성민</title>
    <!-- 구글 폰트: 귀엽고 감성적인 손글씨체 (Gamja Flower, Gaegu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;family=Gamja+Flower&amp;display=swap" rel="stylesheet">
    <!-- Confetti 효과 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* === 기본 및 변수 설정 (크레파스 텍스처 & 색상) === */
        :root {
            --crayon-green: #3a7d44;
            --crayon-dark-green: #295730;
            --crayon-brown: #a0522d;
            --crayon-sand: #e6c594;
            --crayon-red: #e63946;
            --crayon-blue: #1d3557;
            --crayon-yellow: #ffb703;
            --crayon-white: #fefae0;
            --crayon-dark: #2b2d42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gaegu', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* 종이 텍스처 느낌의 배경과 잔디 느낌 */
            background-color: var(--crayon-green);
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(0deg, rgba(0,0,0,0.05) 0%, transparent 100%);
            background-size: 20px 20px, 100% 100%;
            color: var(--crayon-dark);
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 크레파스 테두리 효과 스타일 클래스 */
        .crayon-box {
            background-color: #fffef0;
            border: 4px solid var(--crayon-dark);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 5px 6px 0px rgba(0,0,0,0.25);
            padding: 20px;
            position: relative;
        }

        .crayon-btn {
            background: var(--crayon-yellow);
            border: 3px solid var(--crayon-dark);
            border-radius: 20px 5px 20px 5px/5px 20px 5px 20px;
            padding: 12px 24px;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--crayon-dark);
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            box-shadow: 3px 4px 0px var(--crayon-dark);
            outline: none;
            display: inline-block;
        }

        .crayon-btn:active {
            transform: translate(2px, 3px);
            box-shadow: 1px 1px 0px var(--crayon-dark);
        }

        /* === 헤더 Section (전광판 스타일) === */
        header {
            width: 100%;
            max-width: 700px;
            text-align: center;
            margin-bottom: 25px;
            background-color: var(--crayon-brown);
            border: 5px dashed var(--crayon-sand);
            color: var(--crayon-white);
            border-radius: 20px;
            padding: 20px 10px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.3);
        }

        .scoreboard-title {
            font-size: 2.8rem;
            text-shadow: 3px 3px 0px var(--crayon-dark);
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .nickname-tag {
            display: inline-block;
            background: var(--crayon-red);
            color: white;
            padding: 5px 18px;
            border-radius: 50px;
            font-size: 1.6rem;
            margin-top: 10px;
            border: 2px dashed #fff;
            transform: rotate(-2deg);
        }

        /* === 컨테이너 레이아웃 === */
        main {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h2.section-title {
            font-size: 2rem;
            color: var(--crayon-dark);
            text-align: center;
            margin-bottom: 15px;
            text-decoration: underline stroke var(--crayon-red) 3px;
        }

        /* === 좋아하는 것 카드 (3D Flip Card) === */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
        }

        .flip-card {
            background-color: transparent;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 18px 8px 18px 8px/8px 18px 8px 18px;
            border: 4px solid var(--crayon-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-shadow: 4px 5px 0px rgba(0,0,0,0.2);
        }

        .flip-card-front {
            background-color: #fff;
            color: var(--crayon-dark);
        }

        .flip-card-front .icon {
            font-size: 4rem;
            margin-bottom: 8px;
        }

        .flip-card-front .title {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .flip-card-front .tap-hint {
            font-size: 0.9rem;
            color: #888;
            margin-top: 5px;
        }

        .flip-card-back {
            background-color: var(--crayon-sand);
            color: var(--crayon-dark);
            transform: rotateY(180deg);
            border-color: var(--crayon-brown);
        }

        .flip-card-back h3 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--crayon-brown);
        }

        .flip-card-back p {
            font-size: 1.2rem;
            line-height: 1.3;
            word-break: keep-all;
        }

        /* === OX 퀴즈 섹션 === */
        .quiz-container {
            text-align: center;
        }

        .quiz-question-box {
            background: #ffffff;
            border: 3px solid var(--crayon-dark);
            border-radius: 15px;
            padding: 15px;
            font-size: 1.25rem;
            line-height: 1.5;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 20px;
            text-align: left;
            word-break: keep-all;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
        }

        .ox-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .btn-o, .btn-x {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 2.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 4px solid var(--crayon-dark);
            box-shadow: 3px 4px 0px var(--crayon-dark);
            transition: transform 0.1s;
        }

        .btn-o { background-color: #90be6d; color: white; }
        .btn-x { background-color: #f94144; color: white; }

        .btn-o:active, .btn-x:active {
            transform: scale(0.92);
        }

        .quiz-feedback {
            margin-top: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 35px;
        }

        /* === 무작위 게임 추천 섹션 === */
        .game-recommender {
            text-align: center;
        }

        .game-display-box {
            background-color: var(--crayon-blue);
            color: white;
            border: 4px solid var(--crayon-dark);
            border-radius: 15px;
            padding: 25px 15px;
            font-size: 2rem;
            font-weight: bold;
            margin: 15px 0 20px 0;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            word-break: keep-all;
        }

        /* 야구장 일러스트 요소 (SVG/CSS) */
        .baseball-ground-deco {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            opacity: 0.8;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--crayon-white);
            font-size: 1.1rem;
        }

        /* 모바일 반응형 미디어 쿼리 */
        @media (max-width: 480px) {
            .scoreboard-title { font-size: 2.2rem; }
            .nickname-tag { font-size: 1.3rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .flip-card { height: 180px; }
            .quiz-question-box { font-size: 1.1rem; }
            .game-display-box { font-size: 1.6rem; }
        }
    </style>

      up();
    });
    each('[data-st="dday"]', function (e) {
      var o = e.querySelector('.st-dnum'), t = new Date(e.getAttribute('data-date') + 'T00:00:00'), now = new Date(); now.setHours(0, 0, 0, 0);
      var d = Math.round((t - now) / 864e5); if (o) o.textContent = isNaN(d) ? '날짜를 정해요' : d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : 'D+' + (-d);
    });
    each('[data-st="timer"]', function (e) {
      var m = +e.getAttribute('data-min') || 25, left = m * 60, id = 0, o = e.querySelector('.st-tnum'), go = e.querySelector('.st-tgo'), rs = e.querySelector('.st-trs');
      function p() { o.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); }
      function stop() { clearInterval(id); id = 0; go.textContent = '시작'; }
      go.addEventListener('click', function () { if (id) { stop(); return; } o.classList.remove('is-done'); id = setInterval(function () { if (left > 0) { left--; p(); } if (left <= 0) { stop(); o.classList.add('is-done'); } }, 1000); go.textContent = '잠시 멈춤'; });
      rs.addEventListener('click', function () { stop(); left = m * 60; o.classList.remove('is-done'); p(); });
      p();
    });
    each('[data-st="dark"]', function (b) {
      try { if (localStorage.getItem('st-dark') === '1') document.documentElement.classList.add('st-dark'); } catch (e) {}
      b.addEventListener('click', function () { var on = document.documentElement.classList.toggle('st-dark'); try { localStorage.setItem('st-dark', on ? '1' : '0'); } catch (e) {} });
    });
  })();
</script>
</body></html>
